image: maven:3-eclipse-temurin-21-alpine

stages:
  - build
  - test
  - coverage

variables:
  MAVEN_CLI_OPTS: "--batch-mode --update-snapshots"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository
    - .maven

before_script:
  - mkdir -p .m2/repository
  - mkdir -p .maven

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - rest/target/*.jar
      - .m2/repository
    expire_in: 1 week
    when: on_success

test:
  stage: test
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/*.xml"
    paths:
      - ./**/target/surefire-reports/
    expire_in: 1 day

coverage:
  stage: coverage
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS verify jacoco:report-aggregate
    - bash coverage/extract_coverage.sh coverage/target/site/jacoco-aggregate/index.html
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/failsafe-reports/*.xml"
    paths:
      - ./**/target/failsafe-reports/
      - ./**/target/site/jacoco
      - coverage/target/site/jacoco-aggregate/
    expire_in: 1 day
  coverage: '/TOTAL COVERAGE = \d+(?:\.\d+)?/'
