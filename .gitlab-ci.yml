image: maven:3-eclipse-temurin-21-alpine

stages:
  - build

variables:
  MAVEN_CLI_OPTS: "--batch-mode --update-snapshots"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository
    - .maven

before_script:
  - mkdir -p .m2/repository
  - mkdir -p .maven

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
  artifacts:
    paths:
      - api/target/*.jar
    expire_in: 1 week
