stages:
  - lint
  - build

lint:
  stage: lint
  image: node:23-alpine
  before_script:
    - npm ci
  script:
    - npm run lint
  rules:
    - if: $CI_MERGE_REQUEST_ID

build:
  stage: build
  image: node:23-alpine
  before_script:
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - dist
  rules:
    - when: always
  needs:
    - lint
