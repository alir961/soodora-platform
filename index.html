<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Soodora</title>
    <meta
      name="description"
      content="Soodora is the music-sharing app that makes discovering new and upcoming artists effortless. Explore fresh music, connect with artists, and share your passion." />

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link
      rel="icon"
      type="image/png"
      href="/assets/images/png/favicon-light.png"
      media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/png/favicon-dark.png"
      media="(prefers-color-scheme: light)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.soodora.com/" />
    <meta property="og:title" content="Soodora - The Future Of Music" />
    <meta
      property="og:description"
      content="Soodora is the music-sharing app that makes discovering new and upcoming artists effortless." />
    <meta property="og:image" content="https://app.soodora.com/assets/images/png/embed-banner.png" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://app.soodora.com/" />
    <meta property="twitter:title" content="Soodora - The Future Of Music" />
    <meta
      property="twitter:description"
      content="Soodora is the music-sharing app that makes discovering new and upcoming artists effortless." />
    <meta property="twitter:image" content="https://app.soodora.com/assets/images/png/embed-banner.png" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
