name: groove-conductor

services:
  database:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - api_network

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ***REMOVED***
      GOOGLE_CLIENT_ID: clientId
      GOOGLE_CLIENT_SECRET: clientSecret
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/database
    depends_on:
      - database
    networks:
      - api_network

volumes:
  mariadb_data:

networks:
  api_network:
