name: soodora

services:
  database:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - api_network

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APPLICATION_URL: http://localhost:5173
      ADMINISTRATION_URL: http://localhost:5174
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/database
    depends_on:
      database:
        # The API runs Flyway migrations at startup: wait until MariaDB accepts connections.
        condition: service_healthy
    networks:
      - api_network

  # Catches the e-mails the API sends in local development: inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
      - "1025:1025"  # SMTP, for an API started outside Docker (SMTP_HOST=localhost)
    networks:
      - api_network

volumes:
  mariadb_data:

networks:
  api_network:
