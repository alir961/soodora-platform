# Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.mail.host=${SMTP_HOST:ssl0.ovh.net}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:team@example.com}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.protocol=${SMTP_PROTOCOL:smtps}

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

